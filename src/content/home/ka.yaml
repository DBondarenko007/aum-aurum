faq:
  - q: სად ვიყიდო თაფლი თბილისთან ახლოს?
    a: ჩვენი ოჯახური საფუტკრე სოფელ ნავაზშია — თბილისიდან ყაზბეგისკენ მიმავალ გზაზე, მცხეთის შემდეგ. თაფლი შეუკვეთეთ საიტზე და დაგიკავშირდებით, რომ შევთანხმდეთ, სად აიღოთ.
    hidden: false
  - q: შეიძლება საფუტკრეზე მოსვლა?
    a: დიახ. ჩვენ ნავაზში ვართ, პირდაპირ საქართველოს სამხედრო გზაზე. გთხოვთ, წინასწარ დაგვირეკოთ, რომ დაგხვდეთ.
    hidden: false
  - q: ყიდით ფუტკრის ოჯახებს?
    a: 'დიახ: ძლიერ ოჯახებს და ნუკლეუსებს, გაზაფხულისთვის წინასწარი შეკვეთით. მოგვწერეთ, რამდენი ოჯახი გჭირდებათ და როდის გსურთ წაყვანა.'
    hidden: false
  - q: ამზადებთ სკებს შეკვეთით?
    a: დიახ, სკებს საკუთარი ხელით ვამზადებთ და ჩვენს საფუტკრეზე ვცდით. მოგვწერეთ, რომელი მოდელი და რამდენი სკა გჭირდებათ.
    hidden: false
  - q: გაქვთ მიწოდება საქართველოში? შეიძლება თაფლის საჩუქრად ყიდვა?
    a: 'შესავსებია: მიწოდება, სასაჩუქრე ნაკრები, თაფლის საზღვარგარეთ გატანა.'
    hidden: true
