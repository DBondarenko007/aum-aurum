concept:
  history_title: 5,500 years of Georgian honey
  history_text: In 2003, near the village of Sakire in the Borjomi region, archaeologists found traces of honey in an ancient burial. It is about 5,500 years old — the oldest honey known in the world. We carry on that tradition.
  history_source: 'Source: Eurasianet'
  family_title: Our family
  family_text: We are a family apiary in the village of Navazi, Mtskheta municipality. We look after our bees, harvest honey, raise bee colonies and build hives by hand — the same hives our own bees live in.
