faq:
  - q: Где купить мёд рядом с Тбилиси?
    a: 'Наша семейная пасека находится в селе Навази — по дороге из Тбилиси в Казбеги, сразу за Мцхетой. Мёд можно заказать на сайте: мы свяжемся с вами и договоримся, где его забрать.'
    hidden: false
  - q: Можно ли приехать на пасеку?
    a: Да. Мы находимся в Навази, прямо на Военно-Грузинской дороге. Пожалуйста, позвоните заранее, чтобы мы вас встретили.
    hidden: false
  - q: Продаёте ли вы пчелосемьи?
    a: 'Да: сильные семьи и отводки по предзаказу на весну. Напишите нам, сколько семей нужно и когда вы хотите их забрать.'
    hidden: false
  - q: Делаете ли вы ульи на заказ?
    a: Да, мы строим ульи своими руками и проверяем их на своей пасеке. Напишите, какая модель и сколько ульев вам нужно.
    hidden: false
  - q: Есть ли доставка по Грузии? Можно ли купить мёд в подарок, например по пути в Россию?
    a: 'ЗАПОЛНИТЬ: доставка (куда и как), подарочные наборы, вывоз мёда за границу.'
    hidden: true
