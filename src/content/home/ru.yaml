concept:
  history_title: 5 500 лет грузинскому мёду
  history_text: В 2003 году под Боржоми, у села Сакире, археологи нашли в древнем захоронении следы мёда. Ему около 5 500 лет — это старейший известный мёд в мире. Мы продолжаем эту традицию.
  history_source: 'Источник: Eurasianet'
  family_title: Наша семья
  family_text: Мы — семейная пасека в селе Навази, Мцхетский муниципалитет. Ухаживаем за пчёлами, собираем мёд, разводим пчелосемьи и своими руками строим ульи — те самые, в которых живут наши пчёлы.
  facts:
    - семейная пасека
    - навази, мцхета
    - мёд · пчелосемьи · ульи
    - ульи ручной работы
    - по дороге в казбеги
