title: პერსონალური მონაცემები
text: |-
  ჩვენ ვართ Aum Aurum — ოჯახური საფუტკრე სოფელ ნავაზში, საქართველო.

  შეკვეთისას ვიღებთ თქვენს სახელს, ტელეფონს, მისამართს (თუ მიწოდება გჭირდებათ) და კომენტარს. შეფასების დატოვებისას — სახელს, ქალაქს და შეფასების ტექსტს. ამ მონაცემებს ვიყენებთ მხოლოდ შეკვეთის შესასრულებლად, თქვენთან დასაკავშირებლად და შეფასების გამოსაქვეყნებლად (მხოლოდ თქვენი თანხმობით).

  მონაცემები მოგვდის მესენჯერში ან ელფოსტაზე. მათ მესამე პირებს არ გადავცემთ და რეკლამისთვის არ ვიყენებთ.

  საიტი სარეკლამო cookie-ებს არ იყენებს. მონაცემების ან შეფასების წასაშლელად უბრალოდ მოგვწერეთ.
