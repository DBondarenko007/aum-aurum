title: Персональные данные
text: |-
  Мы — семейная пасека Aum Aurum, село Навази, Грузия.

  Когда вы оформляете заказ, мы получаем имя, телефон, адрес (если нужна доставка) и комментарий. Когда вы оставляете отзыв — имя, город и текст отзыва. Эти данные нужны только чтобы выполнить заказ, связаться с вами и опубликовать отзыв (только с вашего согласия).

  Данные приходят нам в мессенджер или на почту. Мы не передаём их третьим лицам и не используем для рекламы.

  Сайт не использует рекламные cookie. Чтобы удалить свои данные или отзыв, просто напишите нам.
