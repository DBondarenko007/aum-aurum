title: Personal data
text: |-
  We are Aum Aurum, a family apiary in the village of Navazi, Georgia.

  When you place an order we receive your name, phone, address (if delivery is needed) and comment. When you leave a review — your name, city and the review text. We use this only to fulfil the order, contact you and publish the review (only with your consent).

  The data reaches us by messenger or e-mail. We do not share it with third parties or use it for advertising.

  The site uses no advertising cookies. To have your data or review removed, simply message us.
